# fabri — OpenAI failure-recovery benchmark (NON-canonical, ad-hoc)
#
# Same as benchmark.openai.yaml but sandbox_root points at a fixture workspace
# with a deterministic recoverable failure (task asks for notes/agenda.txt; the
# real file is notes/agenda.md). Measures whether cross-session guideline reuse
# REDUCES steps/cost after run 1 mines the "wrong extension" lesson.

agent:
  name: benchmark
  max_steps: 10
  output_format: json
  planner:
    enabled: false
    mode: off
    max_items: 8
    auto_token_threshold: 80
  max_cost_usd: null

llm:
  provider: openai
  model: gpt-4o-mini
  max_tokens: 2048
  api_key_env: OPENAI_API_KEY
  cache_messages: false

tools:
  manifest_dir:
    - builtin
  enabled: [read_file, write_file, list_dir]
  sandbox_root: /Users/rushour0/.cache/claude-code-tmp/claude-501/-Users-rushour0-gba-fabri/f05c5346-2a65-4031-81e7-e571748fb773/scratchpad/bench-ws
  result_format: toon
  agents: []
  decompose:
    enabled: false
    max_subquestions: 5
  retrieval:
    enabled: false
    top_k: 6
    always_include: [spawn_subagent, ask_user, decompose]
  mcp_servers: []

memory:
  backend: sqlite
  collection: benchmark_recovery
  sqlite_path: .fabri/benchmark-recovery.db
  top_k: 5
  similarity_threshold: 0.85
  promotion_threshold_sessions: 3
  guideline_max_tokens: 30
