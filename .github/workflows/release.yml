name: release

# Publishes to PyPI when a version tag (v*) is pushed, via Trusted Publishing
# (OIDC) -- no API token stored anywhere. One-time setup: on pypi.org add a
# pending publisher for project "fabri", owner "Rushour0", repo "fabri",
# workflow "release.yml", environment "pypi". Then: git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: examples/studio/package-lock.json
      - name: Build Studio assets for the wheel
        run: |
          npm --prefix examples/studio ci
          npm --prefix examples/studio run build
      - name: Sync bundled assets and examples
        run: |
          python scripts/sync_studio_assets.py
          python scripts/sync_examples.py
      - name: Remove generated Python bytecode
        run: |
          find src/fabri/examples src/fabri/service/studio_assets -name __pycache__ -prune -exec rm -rf {} +
      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Assert wheel contents
        run: |
          wheel=$(find dist -maxdepth 1 -name '*.whl' -print -quit)
          test -n "$wheel"
          unzip -Z1 "$wheel" > wheel-contents.txt
          grep -Fxq 'fabri/service/studio_assets/index.html' wheel-contents.txt
          grep -Eq '^fabri/service/studio_assets/assets/.+' wheel-contents.txt
          grep -Fxq 'fabri/examples/agencies/bug-triage-crew/workspace/.gitignore' wheel-contents.txt
          if grep -Eq '\.pyc$' wheel-contents.txt; then
            echo 'Wheel unexpectedly contains Python bytecode:' >&2
            grep -E '\.pyc$' wheel-contents.txt >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write          # required for Trusted Publishing (OIDC)
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
