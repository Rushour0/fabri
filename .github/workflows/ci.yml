name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      qdrant:
        image: qdrant/qdrant
        ports:
          - 6333:6333
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Build the Go example tool
        # the compiled sum_tool binary is gitignored; the polyglot-tool test needs it
        run: cd src/fabri/tools/examples/example_go_tool && go build -o sum_tool .

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        # sqlite extra pulls in sqlite-vec so the SqliteMemoryStore-backed
        # retrieval-eval gate (tests/test_retrieval_eval_gate.py) runs instead
        # of skipping. FTS5 BM25 is a Python built-in — no bm25 extra needed.
        run: pip install -e ".[dev,sqlite]"

      - name: Test
        run: pytest tests/ -q

  studio-example:
    # Typecheck + build the Fabri Studio example (examples/studio) so the
    # in-repo React example can't silently rot on a fabri/service change.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/studio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: examples/studio/package-lock.json
      - run: npm ci
      - run: npm run build
