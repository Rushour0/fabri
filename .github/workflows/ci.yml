name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      qdrant:
        image: qdrant/qdrant
        ports:
          - 6333:6333
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Build the Go example tool
        # the compiled sum_tool binary is gitignored; the polyglot-tool test needs it
        run: cd src/fabri/tools/examples/example_go_tool && go build -o sum_tool .

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Cache embedding model
        # all-MiniLM-L6-v2 (~90MB) is downloaded on first embed; cache the HF
        # hub dir so the retrieval-eval gate + memory tests don't re-fetch it.
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-all-MiniLM-L6-v2

      - name: Install
        # sqlite -> sqlite-vec (SqliteMemoryStore); FTS5 BM25 is a Python
        # built-in (no bm25 extra needed). embeddings -> sentence-transformers,
        # which the memory/retrieval suite and the retrieval-eval CI gate
        # (tests/test_retrieval_eval_gate.py) require — without it ~30 tests
        # error/no-op. Install CPU-only torch FIRST so the embeddings extra
        # doesn't pull the multi-GB CUDA torch build.
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev,sqlite,embeddings]"

      - name: Test
        run: pytest tests/ -q

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: examples/studio/package-lock.json

      - name: Build Studio assets for the wheel
        run: |
          npm --prefix examples/studio ci
          npm --prefix examples/studio run build

      - name: Sync bundled assets and examples
        run: |
          python scripts/sync_studio_assets.py
          python scripts/sync_examples.py

      - name: Remove generated Python bytecode
        run: |
          find src/fabri/examples src/fabri/service/studio_assets -name __pycache__ -prune -exec rm -rf {} +

      - name: Build sdist + wheel
        run: python -m build

      - name: Assert wheel contents
        run: |
          wheel=$(find dist -maxdepth 1 -name '*.whl' -print -quit)
          test -n "$wheel"
          unzip -Z1 "$wheel" > wheel-contents.txt
          grep -Fxq 'fabri/service/studio_assets/index.html' wheel-contents.txt
          grep -Eq '^fabri/service/studio_assets/assets/.+' wheel-contents.txt
          grep -Fxq 'fabri/examples/agencies/bug-triage-crew/workspace/.gitignore' wheel-contents.txt
          if grep -Eq '\.pyc$' wheel-contents.txt; then
            echo 'Wheel unexpectedly contains Python bytecode:' >&2
            grep -E '\.pyc$' wheel-contents.txt >&2
            exit 1
          fi

  studio-example:
    # Typecheck + build the Fabri Studio example (examples/studio) so the
    # in-repo React example can't silently rot on a fabri/service change.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/studio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: examples/studio/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
