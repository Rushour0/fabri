# Copy to $FABRI_HOME/jira-resolver.toml (default ~/.fabri/jira-resolver.toml).
# `agency` defaults to the jira-fix-crew agency bundled with fabri. Set it
# only to use your own crew; relative paths resolve against this file's
# directory.
label = "fabri:fix"
max_cost_usd = 10.0
# agency = "/abs/path/to/my-crew"

[projects.AI]
repo = "CharlesLadera/play-shaper"
base = "main"
setup_cmd = "npm --prefix web ci"
test_cmd = "npm --prefix web test"

